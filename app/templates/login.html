{% extends "base.html" %}
{% block title %}Kirish — Kutubxonaga murojaat{% endblock %}
{% block body %}
<main class="login-wrap">
  <section class="login-card">
    <h1>Kutubxonaga murojaat</h1>
    <p class="muted">Shaxsiy kabinetga kirish uchun login va parolni kiriting.</p>

    {% if error %}<p class="alert alert-error" role="alert">{{ error }}</p>{% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <label for="username">Login</label>
      <input id="username" name="username" type="text" value="{{ username }}"
             autocomplete="username" autocapitalize="none" required autofocus>

      <label for="password">Parol</label>
      <input id="password" name="password" type="password"
             autocomplete="current-password" required>

      <button type="submit" class="btn">Kirish</button>
    </form>
  </section>
</main>
{% endblock %}
